<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Confirme seu novo e-mail</title>
</head>
<body style="margin:0;padding:0;background:#FAFAF9;color-scheme:light;font-family:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <div style="max-width:520px;margin:0 auto;padding:48px 24px">

    <div style="margin-bottom:28px">
      <span style="display:inline-block;width:20px;height:3px;background:#FF5A1F;border-radius:2px;vertical-align:middle;margin-right:8px"></span><span style="font-size:15px;font-weight:700;color:#0F0F10;letter-spacing:-0.02em;vertical-align:middle">Taskflow</span>
    </div>

    <div style="background:#FFFFFF;border:1px solid #E4E4E1;border-radius:14px;padding:32px;box-shadow:0 1px 2px rgba(15,15,16,0.04)">
      <h1 style="margin:0 0 10px;font-size:19px;font-weight:600;color:#0F0F10;letter-spacing:-0.01em;line-height:1.3">Confirme seu novo e-mail</h1>
      <p style="margin:0;font-size:14px;line-height:1.65;color:#3F3F44">Confirme a alteração de {{ .Email }} para {{ .NewEmail }}.</p>
      <div style="margin-top:24px">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:11px 24px;background:#FF5A1F;color:#FFFFFF;text-decoration:none;border-radius:10px;font-size:13px;font-weight:600;letter-spacing:-0.01em">Confirmar alteração</a>
      </div>
      <div style="margin-top:28px;padding-top:20px;border-top:1px solid #EDEDEA">
        <p style="margin:0;font-size:12px;line-height:1.6;color:#6B6B70">Problemas com o botão? <a href="{{ .ConfirmationURL }}" style="color:#FF5A1F;text-decoration:none">Use este link</a>.</p>
      </div>
    </div>

    <p style="margin:20px 0 0;font-size:11px;line-height:1.6;color:#6B6B70">Se você não pediu esta alteração, ignore este e-mail.</p>
  </div>
</body>
</html>
