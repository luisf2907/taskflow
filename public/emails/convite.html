<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voce foi convidado</title></head>
<body style="margin:0;padding:0;background:#E4F0EE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:40px 24px">
    <div style="text-align:center;margin-bottom:32px">
      <span style="font-size:20px;font-weight:800;color:#00857A;letter-spacing:-0.5px">Taskflow</span>
    </div>
    <div style="background:#FFFFFF;border-radius:16px;padding:32px;border:1px solid #E1EBE9">
      <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#1C2B29">Voce foi convidado</h1>
      <p style="margin:0 0 8px;font-size:15px;line-height:1.6;color:#4A5D5A">Voce recebeu um convite para participar do Taskflow.</p>
      <div style="text-align:center">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;background:#00857A;color:#FFFFFF;text-decoration:none;border-radius:10px;font-size:14px;font-weight:700;margin-top:16px">Aceitar convite</a>
      </div>
      <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#4A5D5A">Problemas com o botao? <a href="{{ .ConfirmationURL }}" style="color:#00857A">Use este link</a>.</p>
    </div>
    <div style="text-align:center;margin-top:24px;font-size:12px;color:#4A5D5A">
      <p style="margin:0">Se voce nao esperava este convite, pode ignorar este e-mail.</p>
    </div>
  </div>
</body>
</html>
